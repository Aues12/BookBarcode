name: Test publishing to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build isolated test distributions
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set unique TestPyPI-only version
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("bookbarcode/__init__.py")
          source = path.read_text()
          import re
          pattern = r'(?m)^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$'
          match = re.search(pattern, source)
          if not match:
              raise SystemExit("Expected a stable __version__ in bookbarcode/__init__.py")
          version = f"{match.group(1)}.dev{os.environ['RUN_ID']}{os.environ['RUN_ATTEMPT']}"
          path.write_text(re.sub(pattern, f'__version__ = "{version}"', source, count=1))
          print(f"Building TestPyPI-only version {version}")
          PY

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bookbarcode-testpypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: bookbarcode-testpypi-distributions
          path: dist/

      - name: Publish using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
