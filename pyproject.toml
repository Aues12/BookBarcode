[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bookbarcode"
dynamic = ["version"]
description = "Deterministic, print-ready ISBN-13 barcode generation for SVG and CMYK PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["barcode", "ean-13", "isbn", "pdf", "svg"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Aues12/BookBarcode"
Repository = "https://github.com/Aues12/BookBarcode"
Issues = "https://github.com/Aues12/BookBarcode/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0"]

[project.scripts]
bookbarcode = "bookbarcode.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bookbarcode.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["bookbarcode*"]

[tool.setuptools.package-data]
bookbarcode = ["py.typed"]
